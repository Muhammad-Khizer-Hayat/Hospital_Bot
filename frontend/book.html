<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment — City General Hospital</title>
<link rel="stylesheet" href="style.css">
<style>
  body { height: auto; min-height: 100vh; overflow-y: auto; }

  .book-page {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  .book-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .book-header .logo {
    width: 40px; height: 40px;
    background: var(--blue);
    color: #fff;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
  }
  .book-header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--navy);
  }
  .book-header .sub { font-size: 12.5px; color: var(--gray2); }

  .book-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
  }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--gray3);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--gray1);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--white);
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--blue);
  }
  .field select:disabled, .field input:disabled {
    background: var(--gray1);
    color: var(--gray2);
    cursor: not-allowed;
  }
  .field-error {
    font-size: 12px;
    color: var(--red);
    margin-top: 5px;
    display: none;
  }
  .field.has-error input, .field.has-error select { border-color: var(--red); }
  .field.has-error .field-error { display: block; }

  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }

  .submit-btn {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 13px 0;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .submit-btn:hover:not(:disabled)  { background: var(--blue-lt); }
  .submit-btn:active:not(:disabled) { transform: scale(.98); }
  .submit-btn:disabled { background: var(--gray2); cursor: not-allowed; }

  .form-note {
    font-size: 12px;
    color: var(--gray2);
    text-align: center;
    margin-top: 14px;
  }
  .form-note a { color: var(--blue); text-decoration: none; }

  .banner {
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 18px;
    display: none;
  }
  .banner.error { background: #fef2f2; color: #991b1b; display: block; }

  /* Success state */
  .success-card { text-align: center; padding: 40px 28px; }
  .success-icon {
    width: 56px; height: 56px;
    background: #dcfce7;
    color: #16a34a;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin: 0 auto 18px;
  }
  .success-card h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--navy);
    margin-bottom: 10px;
  }
  .success-details {
    text-align: left;
    background: var(--gray1);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 13.5px;
    line-height: 1.9;
    margin: 18px 0;
    color: var(--gray3);
  }
  .success-details strong { color: var(--navy); }
  .success-ref {
    font-family: monospace;
    background: var(--white);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
    color: var(--blue);
  }
</style>
</head>
<body>

  <div class="book-page">
    <div class="book-header">
      <div class="logo">+</div>
      <div>
        <h1>Book an Appointment</h1>
        <div class="sub">City General Hospital</div>
      </div>
    </div>

    <div class="book-card">
      <div id="banner" class="banner error"></div>

      <form id="book-form">
        <div class="field" id="field-name">
          <label for="name">Full Name</label>
          <input type="text" id="name" autocomplete="name" placeholder="e.g. Ayesha Khan">
          <div class="field-error">Please enter your full name.</div>
        </div>

        <div class="field" id="field-country">
          <label for="country">Country</label>
          <input type="text" id="country" autocomplete="country-name" placeholder="e.g. Pakistan">
          <div class="field-error">Please enter a valid country.</div>
        </div>

        <div class="field" id="field-department">
          <label for="department">Department</label>
          <select id="department">
            <option value="">Select a department…</option>
          </select>
          <div class="field-error">Please select a department.</div>
        </div>

        <div class="field" id="field-doctor">
          <label for="doctor">Doctor</label>
          <select id="doctor" disabled>
            <option value="">Select a department first…</option>
          </select>
        </div>

        <div class="field-row">
          <div class="field" id="field-date">
            <label for="date">Date</label>
            <select id="date" disabled>
              <option value="">Select a doctor first…</option>
            </select>
            <div class="field-error">Please select a date.</div>
          </div>

          <div class="field" id="field-time">
            <label for="time">Time</label>
            <select id="time" disabled>
              <option value="">Select a date first…</option>
            </select>
            <div class="field-error">Please select a time.</div>
          </div>
        </div>

        <div class="field" id="field-phone">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" autocomplete="tel" placeholder="e.g. 03001234567">
          <div class="field-error">Please enter a valid phone number.</div>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">Book Appointment</button>
      </form>
    </div>

    <div class="form-note">
      Prefer talking it through? <a href="index.html">Use the chat assistant instead</a>.
    </div>
  </div>

  <script src="book.js"></script>
</body>
</html>
